server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo real, sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.json nunca se cachea (se lee en cada carga para runtime config)
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
